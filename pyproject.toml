[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-attack-detector"
version = "0.2.0"
description = "Graph adversarial attack detection and defense toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = [
  "pytest==8.2.2",
]
training = [
  "joblib==1.4.2",
  "gensim==4.3.2",
  "networkx==3.3",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scikit-learn==1.4.2",
  "scipy==1.12.0",
  "torch==2.2.2",
  "torch-geometric==2.5.3",
  "xgboost==2.0.3",
  "streamlit==1.62.0",
  "tensorboardX==2.6.2.2",
  "texttable==1.7.0",
]

[project.scripts]
gnn-attack-detector = "gnn_attack_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:ast.Str is deprecated.*:DeprecationWarning:torch.jit.frontend",
  "ignore:Attribute s is deprecated.*:DeprecationWarning:torch.jit.frontend",
]
